<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Cyber Owl TTS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f7f7f7;
        }
        h1 {
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .status {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
        }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .links {
            text-align: center;
            margin: 20px 0;
            font-size: 1.1em;
        }
        .links a {
            margin: 0 15px;
            color: #007bff;
            text-decoration: none;
        }
        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>🔊 Cyber Owl TTS</h1>

    <div class="links">
        <a href="/docs" target="_blank">📖 API Документация (Swagger)</a> |
        <a href="/redoc" target="_blank">📚 ReDoc</a>
    </div>

    <div class="form-group">
        <label for="text">Текст для озвучки:</label>
        <textarea id="text" rows="4" placeholder="Введите текст на русском..."></textarea>
    </div>

    <button onclick="speakText()">Озвучить (POST JSON)</button>
    <button onclick="speakGet()">Озвучить через GET</button>

    <div id="status" class="status" style="display: none;"></div>

    <script
        function setStatus(message, isError = false) {
            const statusEl = document.getElementById("status");
            statusEl.textContent = message;
            statusEl.className = "status " + (isError ? "error" : "success");
            statusEl.style.display = "block";
        }

        function speakGet() {
            const text = document.getElementById("text").value;
            if (!text) return alert("Введите текст для озвучки!");

            setStatus("Генерация речи (GET)...");

            // Отправляем легальный GET запрос с автоматическим энкодингом текста браузером
            fetch(`/api/speak?text=${encodeURIComponent(text)}`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === "success") {
                        setStatus("Фраза успешно воспроизведена!");
                    } else {
                        setStatus("Ошибка сервера: " + JSON.stringify(data), true);
                    }
                })
                .catch(error => setStatus("Ошибка сети: " + error, true));
        }

        function speakText() {
            const text = document.getElementById("text").value;
            if (!text) return alert("Введите текст для озвучки!");

            setStatus("Генерация речи (POST JSON)...");

            // На случай, если бэкенд когда-нибудь обновится до POST
            fetch('/api/speak', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            })
            .then(response => {
                if (response.status === 405) {
                    // Если POST запрещен, автоматически перенаправляем на рабочий GET!
                    console.log("POST не поддерживается методом, переключаюсь на GET...");
                    return speakGet();
                }
                return response.json().then(data => setStatus("Воспроизведено (POST)!"));
            })
            .catch(error => console.error("Ошибка POST:", error));
        }

    </script>
</body>
</html>
